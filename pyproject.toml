[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-template"
version = "0.1.0"
description = "A reusable evidence-driven AI development starter"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
ai-project = "ai_project.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-timeout>=2.3.1,<3",
  "pytest-xdist>=3.6,<4",
  "ruff>=0.14.10,<1",
  "ty>=0.0.1,<1",
  "pip>=25,<27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
timeout = 60
markers = [
  "unit: fast, offline CPU tests",
  "network: requires external services",
  "external_data: needs staged data or weights",
  "gpu: needs GPU hardware",
  "integration: installed or end-to-end checks",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ty.environment]
python-version = "3.10"
